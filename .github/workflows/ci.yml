name: Offline pilot verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install hash-locked test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Verify source without third-party runtime dependencies
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run the complete synthetic assurance exercise
        env:
          PYTHONPATH: src
        run: python -m scripts.run_synthetic_pilot

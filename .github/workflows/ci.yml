name: Offline pilot verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install hash-locked test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Verify source without third-party runtime dependencies
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run the complete synthetic assurance exercise
        env:
          PYTHONPATH: src
        run: python -m scripts.run_synthetic_pilot
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # Ruff is a verification tool, not a project dependency; it is pinned but
      # intentionally not hash-locked because it never ships with the package.
      - name: Install verification tools
        run: python -m pip install ruff==0.17.2
      - name: Lint
        run: ruff check .
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: python -m pip install build
      - name: Build wheel and source distribution
        shell: bash
        run: python -m build --outdir "$RUNNER_TEMP/dist"
      - name: Wheel install smoke test outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv-wheel"
          if [ -d "$RUNNER_TEMP/venv-wheel/Scripts" ]; then
            BIN="$RUNNER_TEMP/venv-wheel/Scripts"
            PY="$BIN/python.exe"
          else
            BIN="$RUNNER_TEMP/venv-wheel/bin"
            PY="$BIN/python"
          fi
          "$PY" -m pip install --no-index "$RUNNER_TEMP"/dist/*.whl
          export PATH="$BIN:$PATH"
          "$BIN/fools-gold" --help > /dev/null
          "$PY" -c "import shutil; assert shutil.which('fools-gold'), 'entry point not on PATH'"
          "$PY" -c "from importlib.metadata import version; assert version('fools-gold') == '0.3.0'"
          cd "$RUNNER_TEMP"
          "$PY" -m fools_gold check > /dev/null
          "$PY" -m fools_gold demo --out "$RUNNER_TEMP/demo-wheel" > /dev/null
          test -f "$RUNNER_TEMP/demo-wheel/report.html"
          test -f "$RUNNER_TEMP/demo-wheel/evidence.sqlite"
      - name: Source distribution install smoke test outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv-sdist"
          if [ -d "$RUNNER_TEMP/venv-sdist/Scripts" ]; then
            BIN="$RUNNER_TEMP/venv-sdist/Scripts"
            PY="$BIN/python.exe"
          else
            BIN="$RUNNER_TEMP/venv-sdist/bin"
            PY="$BIN/python"
          fi
          "$PY" -m pip install "$RUNNER_TEMP"/dist/*.tar.gz
          export PATH="$BIN:$PATH"
          "$BIN/fools-gold" --help > /dev/null
          "$PY" -c "import shutil; assert shutil.which('fools-gold'), 'entry point not on PATH'"
          "$PY" -c "from importlib.metadata import version; assert version('fools-gold') == '0.3.0'"
          cd "$RUNNER_TEMP"
          "$PY" -m fools_gold check > /dev/null
          "$PY" -m fools_gold demo --out "$RUNNER_TEMP/demo-sdist" > /dev/null
          test -f "$RUNNER_TEMP/demo-sdist/report.html"
          test -f "$RUNNER_TEMP/demo-sdist/evidence.sqlite"

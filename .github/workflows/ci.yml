name: Offline pilot verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install hash-locked test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Verify source without third-party runtime dependencies
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run the complete synthetic assurance exercise
        env:
          PYTHONPATH: src
        run: python -m scripts.run_synthetic_pilot

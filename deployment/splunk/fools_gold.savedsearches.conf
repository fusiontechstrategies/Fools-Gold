# Fool's Gold starter saved searches.
# Field names follow the flat Wazuh record (fg_*) and the nested HEC event.

[Fool's Gold - unexpected decoy interaction]
search = index=* sourcetype="fools_gold:alert:json" | spath | search event.decoy_id=* | table _time event.alert_id event.decoy_id event.event.actor event.event.actions event.event.outcome
disabled = 1

[Fool's Gold - recon against decoy prefixes]
search = index=* sourcetype="fools_gold:alert:json" | spath | search event.event.actions="*recon*" | table _time event.alert_id event.decoy_id event.event.actor
disabled = 1

[Fool's Gold - unacknowledged alerts older than 30 minutes]
search = index=* sourcetype="fools_gold:alert:json" | spath | search event.alert_id=* | stats latest(_time) as last_seen by event.alert_id
disabled = 1
